<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candle Light</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Candle Light</h1>
      <p>Switch the candle on or off with one click.</p>

      <div class="candle-wrapper">
        <div class="candle" id="candle">
          <div class="flame" id="flame"></div>
          <div class="wax"></div>
        </div>
      </div>

      <button id="toggleBtn" class="toggle-btn">Turn On</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
